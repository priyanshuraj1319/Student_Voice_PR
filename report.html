<html>

<head>
    <meta charset="UTF-8">
    <title>Student Voice - Report an Issue</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="RIPnavbar">
        <div class="menu" onclick="toggleMenu()">&#9776;</div>

        <!-- Dropdown Menu -->
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="index.html">🏠 Home</a>
            <a href="report.html">📝 Report an Issue</a>
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="about.html">ℹ️ About</a>
            <a href="#" onclick="logout()">🚪 Log Out</a>

        </div>
        <h1>Student Voice</h1>
    </div>


    <div class="heading">
        <span class="icon">⚠</span>
        <h2>Report an Issue</h2>
    </div>

    <div class="form-container">

        <form id="issueForm">
            <input type="text" id="name" placeholder="Student name">
            <input type="text" id="roll" placeholder="Roll number">
            <input type="text" id="dept" placeholder="Department">
            <select id="category" required>
                <option value="" disabled selected>Select Category</option>
                <option>Hostel Issue</option>
                <option>Mess Issue</option>
                <option>Electricity</option>
                <option>Water Problem</option>
                <option>Cleaning</option>
                <option>Wifi</option>
                <option>Class Room</option>
                <option>Library</option>
            </select>
            <select id="priority" required>
                <option value="" disabled selected>Select Priority</option>
                <option value="High">High</option>
                <option value="Mid">Mid</option>
                <option value="Low">Low</option>
            </select>
            <textarea id="description" placeholder="Description"></textarea>
            <button type="submit">SUBMIT</button>
        </form>

    </div>


    <!-- Success Popup -->
    <div class="success-overlay hidden" id="successOverlay">
        <div class="success-popup">
            <div class="success-icon">
                <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="26" cy="26" r="26" fill="#4CAF50" />
                    <path d="M14 27 L22 35 L38 19" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </div>
            <h2 class="success-title">Your issue has been submitted<br>successfully!</h2>
            <p class="success-sub">We will notify you once it is updated.</p>
            <button class="success-btn" onclick="window.location.href='dashboard.html'">View Dashboard</button>
        </div>
    </div>
    <footer class="footer">
        <span>Help</span>
        <span class="dot">&#8226;</span>
        <span>Privacy Policy</span>
        <span class="dot">&#8226;</span>
        <span>Terms of Service</span>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
